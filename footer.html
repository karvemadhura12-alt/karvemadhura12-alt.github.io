<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Hero: tag the left-column blocks so they animate in sequence on load.
  document.querySelectorAll('.mx-auto').forEach(function (hero) {
    Array.prototype.slice.call(hero.children).forEach(function (el) { el.classList.add('hero-in'); });
  });

  // Content: fade each section up as it scrolls into view.
  var targets = document.querySelectorAll('.section.level2');
  if (reduce || !('IntersectionObserver' in window)) {
    targets.forEach(function (el) { el.classList.add('is-visible'); });
    return;
  }
  targets.forEach(function (el) { el.classList.add('reveal'); });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  targets.forEach(function (el) { io.observe(el); });
})();
</script>
